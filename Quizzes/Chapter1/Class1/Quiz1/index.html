<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0984 Chapter 1 Class 1 Quiz</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f5f6;color:#111;padding:20px}
main{max-width:850px;margin:auto;background:white;padding:24px;border-radius:10px}
.question{border:1px solid #ddd;border-radius:8px;padding:14px;margin:14px 0}
.question p{font-weight:bold}label{display:block;padding:7px}
button{padding:12px 18px;background:#111;color:white;border:0;border-radius:6px;cursor:pointer}
#result{display:none;background:#eef2f5;padding:16px;margin-top:18px;border-radius:8px}
</style></head><body><main>
<h1>Class 1 Quick Quiz – Chapter 1: Data Representation</h1>
<p>Cambridge IGCSE Computer Science 0984 • 10 questions • 8–10 minutes.<br>
Answer independently, then select <b>Submit answers</b>.</p>
<form id="quiz"></form><button id="submit" type="button">Submit answers</button>
<button id="retry" type="button" style="display:none">Try again</button><section id="result"></section>
<p><small>All the best ... </small></p>
</main><script>
const data = [{"q": "How many bits are in one byte?", "opts": ["4", "8", "16", "32"], "a": 1, "why": "A byte contains 8 bits."}, {"q": "What is the denary value of binary 1010?", "opts": ["8", "9", "10", "12"], "a": 2, "why": "1010\u2082 = 8 + 2 = 10."}, {"q": "Which binary number represents denary 13?", "opts": ["1011", "1101", "1110", "1001"], "a": 1, "why": "13 = 8 + 4 + 1, so it is 1101\u2082."}, {"q": "What is the denary value of hexadecimal A?", "opts": ["8", "9", "10", "11"], "a": 2, "why": "A in hexadecimal represents denary 10."}, {"q": "Which hexadecimal digit represents denary 15?", "opts": ["D", "E", "F", "A"], "a": 2, "why": "F represents denary 15."}, {"q": "Why do computers use binary?", "opts": ["It is easiest for humans", "Electronic circuits can represent two states reliably", "Binary is always smaller", "It uses ten digits"], "a": 1, "why": "Electronic systems can represent two distinct states, commonly 0 and 1."}, {"q": "How many bits are in a nibble?", "opts": ["2", "4", "8", "10"], "a": 1, "why": "A nibble is 4 bits."}, {"q": "What do the three values in an RGB colour code represent?", "opts": ["Red, green and blue intensity", "Read, grey and black", "Rows, grids and boxes", "Red, gold and brown"], "a": 0, "why": "RGB represents red, green and blue intensity."}, {"q": "What is the denary value of hexadecimal 1F?", "opts": ["15", "16", "30", "31"], "a": 3, "why": "1F\u2081\u2086 = 1 \u00d7 16 + 15 = 31."}, {"q": "Convert denary 20 to hexadecimal.", "opts": ["12", "14", "20", "A0"], "a": 1, "why": "20 \u00f7 16 gives 1 remainder 4, so 20\u2081\u2080 = 14\u2081\u2086."}];
const letters=["A","B","C","D"], form=document.getElementById("quiz");
data.forEach((item,i)=>{const sec=document.createElement("section");sec.className="question";
const p=document.createElement("p");p.textContent=(i+1)+". "+item.q;sec.appendChild(p);
item.opts.forEach((opt,j)=>{const lab=document.createElement("label"),r=document.createElement("input");
r.type="radio";r.name="q"+i;r.value=j;lab.appendChild(r);lab.append(" "+letters[j]+". "+opt);sec.appendChild(lab);});
form.appendChild(sec);});
document.getElementById("submit").onclick=()=>{
let score=0,answered=0,review="";
data.forEach((item,i)=>{const selected=form.querySelector('input[name="q'+i+'"]:checked');
if(selected)answered++;const ok=selected&&Number(selected.value)===item.a;if(ok)score++;
review+="<p><b>"+(i+1)+". "+(ok?"Correct":"Review")+" — answer "+letters[item.a]+"</b><br>"+item.why+"</p>";});
const result=document.getElementById("result");result.style.display="block";
if(answered<10){result.innerHTML="<b>Please answer all 10 questions.</b> You have answered "+answered+" of 10.";return;}
const level=score>=8?"Secure understanding":score>=6?"Developing – review the explanations":"Revisit binary place values and hexadecimal";
result.innerHTML="<h2>Your score: "+score+" / 10</h2><b>"+level+"</b><hr>"+review;
document.getElementById("submit").style.display="none";document.getElementById("retry").style.display="inline-block";};
document.getElementById("retry").onclick=()=>{form.reset();document.getElementById("result").style.display="none";
document.getElementById("submit").style.display="inline-block";document.getElementById("retry").style.display="none";window.scrollTo(0,0);};
</script></body></html>
